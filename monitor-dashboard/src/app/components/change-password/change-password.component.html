<!-- src/app/components/change-password/change-password.component.html -->
<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Change password">

    <div class="modal-head">
      <span class="modal-title">Change Password</span>
      <button class="btn-close" (click)="close()" aria-label="Close">✕</button>
    </div>

    <form class="modal-body" (ngSubmit)="submit()" novalidate>

      <!-- Current password -->
      <div class="field-group">
        <label class="field-label">Current password</label>
        <div class="input-wrap">
          <input class="field-input" [type]="showCurrent ? 'text' : 'password'"
                 [(ngModel)]="currentPassword" name="currentPassword"
                 placeholder="••••••••" [disabled]="loading" autocomplete="current-password" />
          <button type="button" class="toggle-pass" (click)="showCurrent = !showCurrent">
            {{ showCurrent ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      <!-- New password -->
      <div class="field-group">
        <label class="field-label">New password</label>
        <div class="input-wrap">
          <input class="field-input" [type]="showNew ? 'text' : 'password'"
                 [(ngModel)]="newPassword" name="newPassword"
                 placeholder="••••••••" [disabled]="loading" autocomplete="new-password" />
          <button type="button" class="toggle-pass" (click)="showNew = !showNew">
            {{ showNew ? '🙈' : '👁' }}
          </button>
        </div>
        <!-- Strength meter -->
        <div class="strength-wrap" *ngIf="newPassword">
          <div class="strength-bar">
            <div class="strength-fill {{ strengthClass }}" [style.width.%]="strengthLevel * 25"></div>
          </div>
          <span class="strength-text {{ strengthClass }}">{{ strengthLabel }}</span>
        </div>
      </div>

      <!-- Confirm password -->
      <div class="field-group">
        <label class="field-label">Confirm new password</label>
        <input class="field-input" type="password"
               [(ngModel)]="confirmPassword" name="confirmPassword"
               placeholder="••••••••" [disabled]="loading" autocomplete="new-password" />
      </div>

      <!-- Feedback -->
      <div class="error-banner" *ngIf="errorMsg" role="alert">⚠ {{ errorMsg }}</div>
      <div class="success-banner" *ngIf="successMsg" role="status">✓ {{ successMsg }}</div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="close()" [disabled]="loading" routerLink="audit-dashboard">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="loading">
          <span *ngIf="!loading">Update password</span>
          <span *ngIf="loading" class="loading-dots"><span></span><span></span><span></span></span>
        </button>
      </div>

    </form>
  </div>
</div>
